<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <script>
      // Paint the stored appearance BEFORE the stylesheet resolves. Without this
      // a reader who chose Light on a dark system gets a black flash on every
      // load, because prefers-color-scheme wins until React mounts.
      try {
        var m = localStorage.getItem('dotstore.theme');
        if (m === 'light' || m === 'dark') {
          document.documentElement.dataset.theme = m;
          document.documentElement.style.colorScheme = m;
        }
      } catch (e) {
        /* private mode: fall back to the system preference */
      }
    </script>
    <title>dot-store — apps on the Polkadot devnet</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7.5' fill='%23e6007a'/%3E%3Ccircle cx='16' cy='16' r='4.6' fill='%23fff'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Every app registered on the Polkadot Products devnet, with real screenshots and on-chain reviews. Read from the chain on every load."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
