name: keep the published sites alive

# Levity/Bulletin retention is a window, not forever: Parity's own write-up puts
# it at "approximately fourteen days", after which unrenewed data "falls off the
# network automatically". Renewing means re-publishing — there is no renew verb
# in the CLI — and `pad` is incremental, so a republish of unchanged files is
# cheap.
#
# italiarovente republishes daily, so it renews itself. dotmetrics used to
# renew itself hourly too, but its refresh job now publishes the SITE only when
# the app source actually changes (the directory reaches the page through a
# DotNS text record instead), so a quiet fortnight would expire its bundle like
# any other — it is in the matrix below for exactly that reason. The remaining
# five only get published when someone changes them. This job is the difference
# between "still up" and "was up when we last looked".
#
# Runs weekly — half the retention window, so a single failed run cannot expire
# anything before the next one.

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

concurrency:
  group: bulletin-keepalive
  cancel-in-progress: false

jobs:
  republish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Sequential on purpose: every publish signs from the same account, and
      # concurrent jobs would race the same transaction nonce.
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - dir: truereviews
            name: truereviews.dot
          - dir: thebutton
            name: thebutton.dot
          - dir: openpetition
            name: openpetition.dot
          - dir: wudcommunity
            name: wudcommunity.dot
          - dir: discreet
            name: discreetly.dot
          # No longer self-renewing: its hourly job gates site publishes on an
          # actual app change, so the weekly renewal lives here like everyone
          # else's. (`pad` is incremental — an unchanged republish is cheap.)
          - dir: dotmetrics
            name: dotmetrics.dot
          # Same arrangement as dotmetrics: the hourly job only publishes when
          # the catalog or the app actually changed, so retention is this job's
          # business. Its build needs the catalog synced first, or a fresh
          # checkout would publish whatever data was last committed.
          - dir: dot-store
            name: dot-store.dot
            presteps: sync
          # peoplebook's hourly-ish refresh only publishes when the directory
          # changes, so a quiet fortnight would expire its bundle. Its data.json
          # is committed, so a plain build renews with the last-known directory.
          - dir: peoplebook
            name: peoplebook.dot
          # These two have no refresh job of their own at all: they are
          # published only when we change them, so nothing renews them. Both
          # read their content from contracts rather than from a data file, so
          # a plain build renews the bundle without any prestep.
          - dir: chirp
            name: chirponchain.dot
          - dir: peoplewiki
            name: peoplewiki.dot
          # Reads everything live from contracts, so there is no data to refresh
          # and a plain build renews the bundle. It had no automation at all
          # until now, which meant nothing was renewing it.
          - dir: dotdirectory
            name: dotdirectory.dot
          # The Discourse archive is committed packed (archive/), and the build
          # unpacks it, so a clean checkout republishes the identical bundle
          # instead of a forum with no history in it.
          - dir: polkadot-forum
            name: polkadot-forum.dot
          # No chain reads at all: the detector runs in the tab. A plain build
          # renews it.
          - dir: aidetector
            name: aidetector.dot
          # One static file, no build — so `npm ci` and `npm run build` would
          # both fail on it. The staging step below handles it instead.
          - dir: chirpwatch
            name: chirpwatch.dot
            presteps: static
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        if: matrix.presteps != 'static'
        working-directory: ${{ matrix.dir }}
        run: npm ci

      - name: Install publish CLI
        run: npm install -g @polkadot-community-foundation/polkadot-app-deploy@0.13.1

      # dot-store bakes the catalog and the artwork into its bundle, so a
      # retention republish has to sync them first — otherwise the renewal would
      # quietly ship whatever data happened to be committed last.
      - name: Sync the catalog from dotmetrics
        if: matrix.presteps == 'sync'
        working-directory: ${{ matrix.dir }}
        run: node scripts/sync-catalog.mjs

      # A static app has no toolchain to run. Staging its one file IS the build,
      # and asking npm to do it would only invent a way to fail.
      - name: Stage the static file
        if: matrix.presteps == 'static'
        working-directory: ${{ matrix.dir }}
        run: sh build.sh

      - name: Build
        if: matrix.presteps != 'static'
        working-directory: ${{ matrix.dir }}
        run: npm run build

      - name: Republish ${{ matrix.name }}
        working-directory: ${{ matrix.dir }}
        env:
          MNEMONIC: ${{ secrets.DEVNET_MNEMONIC }}
          DOTNS_MNEMONIC: ${{ secrets.DEVNET_MNEMONIC }}
        run: |
          set -euo pipefail
          # pad draws a Bulletin storage account from a shared pool and some of
          # those accounts are unauthorised; on a bad draw it fails hard instead
          # of trying another. Seven renewals in a row is seven chances to lose
          # that lottery. The script retries, keeps pad's full output so a
          # failure is readable, and still treats "Verified on-chain" as the
          # only proof — a renewal that did not verify did not happen.
          bash ../.github/scripts/pad-publish.sh ./dist ${{ matrix.name }}

  authorization:
    # Watch the authorizations that publishing ACTUALLY depends on.
    #
    # This job used to check only our own account and hard-fail on it. That was
    # the wrong target twice over. `pad` does not sign with our account at all:
    # it draws from a pool of storage accounts derived `//deploy/0…N`, and per
    # its own DEPLOYMENT.md, "storage is gated by this quota, not by balance
    # (Bulletin has no fee model)". So the pool's authorization is what keeps
    # every published app alive, and it was invisible here.
    #
    # When first measured, five of the ten pool accounts were already NOT
    # AUTHORIZED — which is exactly the "lottery" that pad-publish.sh retries
    # around: a bad draw is a dead account, not a flaky network. And the five
    # live ones expired sooner than our own authorization did, so the job that
    # was meant to give early warning would have reported all-clear right up to
    # the day publishing stopped.
    #
    # Our own authorization still matters, but only for `dotns bulletin upload`
    # (the dotmetrics directory pointer) — so it is reported as a warning
    # against that one pipeline rather than as a failure of everything.
    runs-on: ubuntu-latest
    steps:
      # This job needed no checkout while it was a couple of inline `node -e`
      # snippets. It reports through a script in the repo now, so it does.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dotns
        run: npm install -g @polkadot-community-foundation/dotns-cli@0.8.0

      - name: Report pool authorization — what publishing depends on
        env:
          MNEMONIC: ${{ secrets.DEVNET_MNEMONIC }}
          DOTNS_MNEMONIC: ${{ secrets.DEVNET_MNEMONIC }}
        run: |
          set -uo pipefail
          # The `//deploy/0…9` pool for the default DEV_PHRASE, as reported by
          # `polkadot-app-bootstrap --env devnet`. Listed literally so this check
          # stays read-only: bootstrap attempts a grant as a side effect, and a
          # monitoring job should not try to write.
          POOL="5DDa6Wx3AV7UNCF7rf7dvHuU29Q6scojoQMohpMnCUiQN7BJ
          5Gut8tFYUgwwvw7Gubnze1zmXmDp2VXaeA9bPYRbmNb2qius
          5HKYxtJNB6x2X8RBVoQkGCH3m7zUnSSk5t6pBrcMgNuy4sw7
          5DWgpEFKY27TG4EXo4hLD6iuXQGGjcdBEgj8y12pqjxjhiTk
          5C4xnD5VgfPLnfXGcj4w8T9S1gmext48jcyRbxzktrGuMY5V
          5HmfJ5q1pwuDf7L1cQ1xNtgKm747tUs2BGSrguiWCjnRjpgx
          5FC773CZwHN2oigFFf79VzCzJZbyrYNNixPHdHJcTGaa9T69
          5HQaXiJtNRtk7WS9cXwuiMLXgXpT8YzuuDZ1J7bZe4DYAv8i
          5HZK3oa3DBccmDu4AHAet8RfvKUGKj4La6ePTXQM5bGXzwFo
          5EX8aPS3X2X8mhgqhcfz4uQeR5SnHWwRMnwpHmrUBLuiBbPf"

          : > /tmp/pool.jsonl
          for a in $POOL; do
            line=$(dotns bulletin status "$a" --env devnet --json 2>/dev/null | tr -d '\r' | tail -1)
            echo "{\"address\":\"$a\",\"status\":${line:-null}}" >> /tmp/pool.jsonl
          done
          node .github/scripts/report-pool.mjs /tmp/pool.jsonl

      - name: Report our own authorization — used by the dotmetrics pointer only
        if: always()
        env:
          MNEMONIC: ${{ secrets.DEVNET_MNEMONIC }}
          DOTNS_MNEMONIC: ${{ secrets.DEVNET_MNEMONIC }}
        run: |
          set -uo pipefail
          dotns bulletin status --env devnet --json 2>/dev/null | tr -d '\r' | tail -1 > /tmp/auth.json
          node -e '
            const a = JSON.parse(require("fs").readFileSync("/tmp/auth.json", "utf8"));
            const days = (Date.parse(a.expiresAt) - Date.now()) / 86400000;
            console.log(`our account: authorized=${a.authorized} expires ${a.expiresAt} (${days.toFixed(1)} days)`);
            console.log(`quota left:  ${a.transactions} transactions, ${(Number(a.bytes)/1048576).toFixed(1)} MiB`);
            if (!a.authorized || a.expired || days < 3)
              console.log("::warning::`dotns bulletin upload` is about to stop working — the dotmetrics directory pointer depends on it (site publishes do not)");
          '
