name: keep the published sites alive

# Bulletin drops data that has not been renewed after fourteen days
# (RetentionPeriod = 201,600 blocks at 6s, read from the live chain). This job
# used to answer that by rebuilding and republishing all fourteen bundles every
# week, on the belief â€” written into its own header â€” that "renewing means
# re-publishing, there is no renew verb".
#
# That is true of the CLI and false of the chain. The Bulletin runtime carries
# `renew`, `force_renew` and `enable_auto_renew`, the last being a RECURRING
# scheduler driven by its own on_initialize and a block inherent. It is feeless:
# the cost is storage-authorization quota, not tokens. So every block of every
# published bundle is now registered with it, and the chain renews them with no
# caller at all â€” not a keeper, not a cron, nobody.
#
# WHAT IS LEFT FOR THIS JOB, AND WHY IT IS NOT NOTHING
# The renewal is autonomous; the things it depends on are not.
#   - A registration is dropped with `AutoRenewalFailed` if the registering
#     account's quota is exhausted at cycle time.
#   - Publishing a new version mints new CIDs, and new CIDs are not registered
#     until someone registers them. Forgetting that step is silent and only
#     bites a fortnight later.
#   - Nothing on-chain will tell us either of those happened.
# So this re-arms whatever is unregistered (cheap, idempotent, feeless) and then
# VERIFIES from chain state, failing loudly if anything is still missing. It
# writes rarely and proves every time, which is the opposite of what it used to
# do: fourteen republishes a week, each a coin flip against an unauthorised
# storage account, proving nothing.
#
# It also no longer needs a secret. `pad` derives its storage pool from
# DEV_PHRASE at //deploy/0â€¦9, so these keys are public by construction and
# DEVNET_MNEMONIC is not used here any more.

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

concurrency:
  group: bulletin-keepalive
  cancel-in-progress: false

jobs:
  renewals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dotdirectory/package-lock.json

      - name: Install dependencies
        working-directory: dotdirectory
        run: npm ci

      # Resolves each site through its own DotNS contenthash â€” the pointer the
      # gateway actually serves â€” then walks the dag-pb DAG and registers every
      # block. Registering only the root would keep an index alive while the
      # JavaScript under it expired, which is a green light on a dead page.
      - name: Re-arm any unregistered blocks
        working-directory: dotdirectory
        run: node scripts/renew-all.mjs --go

      # Separate pass, read from AutoRenewals rather than from the previous
      # step's exit code. A write that returned ok and changed nothing has
      # happened on this chain before.
      - name: Verify from chain state
        working-directory: dotdirectory
        run: node scripts/renew-all.mjs --verify

  authorization:
    # Watch the authorizations that publishing ACTUALLY depends on.
    #
    # This job used to check only our own account and hard-fail on it. That was
    # the wrong target twice over. `pad` does not sign with our account at all:
    # it draws from a pool of storage accounts derived `//deploy/0â€¦N`, and per
    # its own DEPLOYMENT.md, "storage is gated by this quota, not by balance
    # (Bulletin has no fee model)". So the pool's authorization is what keeps
    # every published app alive, and it was invisible here.
    #
    # When first measured, five of the ten pool accounts were already NOT
    # AUTHORIZED â€” which is exactly the "lottery" that pad-publish.sh retries
    # around: a bad draw is a dead account, not a flaky network. And the five
    # live ones expired sooner than our own authorization did, so the job that
    # was meant to give early warning would have reported all-clear right up to
    # the day publishing stopped.
    #
    # Our own authorization still matters, but only for `dotns bulletin upload`
    # (the dotmetrics directory pointer) â€” so it is reported as a warning
    # against that one pipeline rather than as a failure of everything.
    runs-on: ubuntu-latest
    steps:
      # This job needed no checkout while it was a couple of inline `node -e`
      # snippets. It reports through a script in the repo now, so it does.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dotns
        run: npm install -g @polkadot-community-foundation/dotns-cli@0.8.0

      - name: Report pool authorization â€” what publishing depends on
        env:
          MNEMONIC: ${{ secrets.DEVNET_MNEMONIC }}
          DOTNS_MNEMONIC: ${{ secrets.DEVNET_MNEMONIC }}
        run: |
          set -uo pipefail
          # The `//deploy/0â€¦9` pool for the default DEV_PHRASE, as reported by
          # `polkadot-app-bootstrap --env devnet`. Listed literally so this check
          # stays read-only: bootstrap attempts a grant as a side effect, and a
          # monitoring job should not try to write.
          POOL="5DDa6Wx3AV7UNCF7rf7dvHuU29Q6scojoQMohpMnCUiQN7BJ
          5Gut8tFYUgwwvw7Gubnze1zmXmDp2VXaeA9bPYRbmNb2qius
          5HKYxtJNB6x2X8RBVoQkGCH3m7zUnSSk5t6pBrcMgNuy4sw7
          5DWgpEFKY27TG4EXo4hLD6iuXQGGjcdBEgj8y12pqjxjhiTk
          5C4xnD5VgfPLnfXGcj4w8T9S1gmext48jcyRbxzktrGuMY5V
          5HmfJ5q1pwuDf7L1cQ1xNtgKm747tUs2BGSrguiWCjnRjpgx
          5FC773CZwHN2oigFFf79VzCzJZbyrYNNixPHdHJcTGaa9T69
          5HQaXiJtNRtk7WS9cXwuiMLXgXpT8YzuuDZ1J7bZe4DYAv8i
          5HZK3oa3DBccmDu4AHAet8RfvKUGKj4La6ePTXQM5bGXzwFo
          5EX8aPS3X2X8mhgqhcfz4uQeR5SnHWwRMnwpHmrUBLuiBbPf"

          : > /tmp/pool.jsonl
          for a in $POOL; do
            line=$(dotns bulletin status "$a" --env devnet --json 2>/dev/null | tr -d '\r' | tail -1)
            echo "{\"address\":\"$a\",\"status\":${line:-null}}" >> /tmp/pool.jsonl
          done
          node .github/scripts/report-pool.mjs /tmp/pool.jsonl

      - name: Report our own authorization â€” used by the dotmetrics pointer only
        if: always()
        env:
          MNEMONIC: ${{ secrets.DEVNET_MNEMONIC }}
          DOTNS_MNEMONIC: ${{ secrets.DEVNET_MNEMONIC }}
        run: |
          set -uo pipefail
          dotns bulletin status --env devnet --json 2>/dev/null | tr -d '\r' | tail -1 > /tmp/auth.json
          node -e '
            const a = JSON.parse(require("fs").readFileSync("/tmp/auth.json", "utf8"));
            const days = (Date.parse(a.expiresAt) - Date.now()) / 86400000;
            console.log(`our account: authorized=${a.authorized} expires ${a.expiresAt} (${days.toFixed(1)} days)`);
            console.log(`quota left:  ${a.transactions} transactions, ${(Number(a.bytes)/1048576).toFixed(1)} MiB`);
            if (!a.authorized || a.expired || days < 3)
              console.log("::warning::`dotns bulletin upload` is about to stop working â€” the dotmetrics directory pointer depends on it (site publishes do not)");
          '
