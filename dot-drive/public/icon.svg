<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    A sealed box: a parcel drawn in isometric, with a seal on its face.
    Flat fills and one accent, so it stays legible at 16 pixels in a tab
    where a stroke-only mark turns to mush.
  -->
  <rect width="32" height="32" rx="7" fill="#1c1917"/>
  <path d="M6 11.2L16 6l10 5.2v9.6L16 26 6 20.8z" fill="none" stroke="#fafaf9"
        stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M6 11.2L16 16.4l10-5.2M16 16.4V26" fill="none" stroke="#fafaf9"
        stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="16" cy="13.4" r="2.6" fill="#e11d48"/>
</svg>
