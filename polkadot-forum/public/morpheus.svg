<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Morpheus">
  <defs>
    <radialGradient id="mbg" cx="50%" cy="32%" r="80%">
      <stop offset="0" stop-color="#2b1830"/>
      <stop offset="0.6" stop-color="#150f18"/>
      <stop offset="1" stop-color="#0a080c"/>
    </radialGradient>
    <linearGradient id="mlens" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#241f26"/>
      <stop offset="0.55" stop-color="#050505"/>
      <stop offset="1" stop-color="#0c0a0d"/>
    </linearGradient>
    <linearGradient id="mcoat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20161f"/>
      <stop offset="1" stop-color="#0f0a10"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" fill="url(#mbg)"/>

  <!-- shoulders / high collar coat -->
  <path d="M14 100 C16 78 30 70 50 70 C70 70 84 78 86 100 Z" fill="url(#mcoat)"/>
  <path d="M40 72 L50 84 L60 72 L57 100 L43 100 Z" fill="#0d090e"/>

  <!-- head -->
  <ellipse cx="50" cy="47" rx="21" ry="24" fill="#1b141a"/>
  <ellipse cx="50" cy="30" rx="21" ry="12" fill="#140f14"/>

  <!-- round Morpheus shades -->
  <g>
    <circle cx="40" cy="46" r="10.5" fill="url(#mlens)" stroke="#2e2830" stroke-width="1.4"/>
    <circle cx="60" cy="46" r="10.5" fill="url(#mlens)" stroke="#2e2830" stroke-width="1.4"/>
    <rect x="48.5" y="45" width="3" height="2.2" rx="1" fill="#2e2830"/>
    <line x1="29.7" y1="45" x2="22" y2="42.5" stroke="#2e2830" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="70.3" y1="45" x2="78" y2="42.5" stroke="#2e2830" stroke-width="1.6" stroke-linecap="round"/>
    <!-- pink glint, the one Polkadot note -->
    <ellipse cx="36" cy="42" rx="3" ry="2" fill="#e6007a" opacity="0.55" transform="rotate(-25 36 42)"/>
    <ellipse cx="56" cy="42" rx="3" ry="2" fill="#e6007a" opacity="0.55" transform="rotate(-25 56 42)"/>
  </g>
</svg>
